name: Render flight video

on:
  workflow_dispatch:
    inputs:
      flight:
        description: "Real flight number, e.g. PR127 (leave empty to use raw_track sample instead)"
        default: ""
      date:
        description: "Flight date YYYY-MM-DD (the day it took off)"
        default: ""
      route:
        description: "Optional ICAO route to list alternatives if the flight number is not found, e.g. RPLL-WSSS"
        default: ""
      logo_pos:
        description: "Lipad Pinas logo position: bc (lower middle) tl tr bl br"
        default: "bc"
      voice_dir:
        description: "Optional: repo folder with pre-generated narration clips s0.mp3, s1.mp3 ... (e.g. made with Higgsfield)"
        default: ""
      voice_name:
        description: 'Google voice name, e.g. en-US-Chirp3-HD-Puck (blank = Neural2 by gender)'
        required: false
        default: ''
      voice_gender:
        description: "Narrator voice: MALE or FEMALE"
        default: "MALE"
      raw_track:
        description: "Only used when flight is empty: raw track JSON in the repo (see data/)"
        default: "data/mnl-ceb-raw.json"
      flight_secs:
        description: "Total video length in seconds"
        default: "64"
      zoom_cruise:
        description: "Cruise zoom (6.4 = regional international, 8.2 = short domestic hop)"
        default: "6.4"
      fps:
        description: "Render fps (output is always 30)"
        default: "15"
  # Daily schedule - enable once a real flight-data step exists (see README):
  # schedule:
  #   - cron: "0 22 * * *"    # 22:00 UTC = 06:00 PHT

concurrency:
  group: render-video
  cancel-in-progress: false
permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install ffmpeg + dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-liberation
          npm install
          pip install --break-system-packages edge-tts || pip install edge-tts
          npx playwright install --with-deps chromium
      - name: Clean track + render video
        env:
          GOOGLE_MAP_TILES_KEY: ${{ secrets.GOOGLE_MAP_TILES_KEY }}
          FR24_API_KEY: ${{ secrets.FR24_API_KEY }}
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
        run: |
          mkdir -p out
          set -o pipefail
          exec > >(tee out/run.log) 2>&1
          trap 'echo "::error title=Render failed::$(tail -n 14 out/run.log | tr "\n" " " | cut -c1-900)"' ERR
          RAW="${{ inputs.raw_track }}"
          if [ -n "${{ inputs.flight }}" ]; then
            node tools/fetch-fr24.js --flight "${{ inputs.flight }}" --date "${{ inputs.date }}" --route "${{ inputs.route }}" --out out/raw.json
            RAW=out/raw.json
          fi
          node tools/process-track.js "$RAW" out/track.json --pacing uniform --dt 10 --video-secs "${{ inputs.flight_secs }}" --pad-secs 2
          if [ -n "${{ inputs.flight }}" ]; then
            FROMI=$(node -p "require('./out/raw.json').meta.fromIcao"); TOI=$(node -p "require('./out/raw.json').meta.toIcao"); DAY=$(node -p "require('./out/raw.json').meta.date")
            node tools/route-stats.js --route "$FROMI-$TOI" --to "$DAY" --days 7 || echo "route stats unavailable"
          fi
          node tools/make-narration.js out/track.json out/narration.json --video-secs "${{ inputs.flight_secs }}"
          if [ -n "${{ inputs.voice_dir }}" ]; then
            if [ -f "${{ inputs.voice_dir }}/urls.txt" ]; then while read -r i u; do curl -fsSL -o "${{ inputs.voice_dir }}/s$i.mp3" "$u"; done < "${{ inputs.voice_dir }}/urls.txt"; fi
            [ -f "${{ inputs.voice_dir }}/narration.json" ] && cp "${{ inputs.voice_dir }}/narration.json" out/narration.json
          fi
          node tools/make-voice.js out/narration.json out/voice --video-secs "${{ inputs.flight_secs }}" --gender "${{ inputs.voice_gender }}" ${{ inputs.voice_name && format('--voice "{0}"', inputs.voice_name) || '' }} ${{ inputs.voice_dir && format('--files-dir "{0}"', inputs.voice_dir) || '' }}
          ZC="${{ inputs.zoom_cruise }}"; DOM=$(node -p "const m=require('./$RAW').meta; m.fromCountry===m.toCountry"); if [ "$DOM" = "true" ] && [ "$ZC" = "6.4" ]; then ZC=8.2; echo "domestic flight: closer zoom $ZC"; fi
          ZIN=$(awk "BEGIN{printf \"%.4f\", (${{ inputs.flight_secs }}-10)/${{ inputs.flight_secs }}}")   # final zoom-in starts 10 s before the video ends
          AIRLOGO=""; [ -f out/airline.png ] && AIRLOGO="--airline-logo out/airline.png"
          node render-flat.js --track out/track.json --out out/video.mp4 \
            --fps "${{ inputs.fps }}" --out-fps 30 --intro 0 --flight "${{ inputs.flight_secs }}" --outro 0 \
            --zoom-close 12 --zoom-cruise "$ZC" --zoom-out-end .16 --zoom-in-start $ZIN \
            --logo assets/logo.png --logo-pos "${{ inputs.logo_pos }}" $AIRLOGO --audio out/voice/voice.wav --captions out/voice/captions.json --max-tiles 8000
      - name: Publish video (public release link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="video-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" out/video.mp4 out/narration.json --title "$TAG" --notes "Rendered from ${{ inputs.flight || inputs.raw_track }} ${{ inputs.date }}"
          echo "Video: https://github.com/${{ github.repository }}/releases/download/$TAG/video.mp4" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/video.mp4
