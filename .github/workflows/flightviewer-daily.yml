name: Flight Viewer daily video

# Posts ONE worldwide flight video to the Flight Viewer Facebook page via its own Buffer account.
# Manual only for now: dry defaults to "true" (plans + renders + captions, posts nothing, records nothing).
# Needs repo secret BUFFER_API_KEY_FLIGHTVIEWER (plus the existing render secrets).
# Uses the English global narration/captions (render.yml narration=global).
on:
  workflow_dispatch:
    inputs:
      dry:
        description: "true = plan + render + captions but do NOT post or record"
        default: "true"
      logo_file:
        description: "Logo: repo path or public image URL (default = Flight Viewer profile logo)"
        default: "https://d8j0ntlcm91z4.cloudfront.net/user_3GDyB9CBU8cUPZRYk1KDgs9JiA9/hf_20261115_020419_2a89c71b-682f-4eb5-8b67-23d52e7222ee.png"
      post_tz:
        description: "Time zone for the publish time (CST = America/Chicago, handles daylight saving)"
        default: "America/Chicago"
      post_time:
        description: "Local publish time HH:MM in that zone (default 7 AM; the next 7 AM that is still ahead)"
        default: "07:00"

concurrency:
  group: flightviewer-daily
  cancel-in-progress: false
permissions:
  contents: write
  actions: write

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      BUFFER_API_KEY_FLIGHTVIEWER: ${{ secrets.BUFFER_API_KEY_FLIGHTVIEWER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Plan, render, caption, schedule
        env:
          DRY: ${{ inputs.dry }}
          LOGO: ${{ inputs.logo_file }}
          PTZ: ${{ inputs.post_tz }}
          PTIME: ${{ inputs.post_time }}
        run: |
          set -o pipefail
          TARGET=$(TZ="$PTZ" date +%F)
          DUE=$(date -u -d "TZ=\"$PTZ\" $TARGET $PTIME" +%FT%TZ)
          if [[ "$DUE" < "$(date -u -d '+30 minutes' +%FT%TZ)" ]]; then TARGET=$(TZ="$PTZ" date -d '+1 day' +%F); DUE=$(date -u -d "TZ=\"$PTZ\" $TARGET $PTIME" +%FT%TZ); fi   # today's slot already passed -> next day's
          echo "publish $DUE (target $TARGET)"
          FLIGHTDAY=$(date -u -d 'yesterday' +%F)
          LASTP=$(node -p "const p=require('./data/history-flightviewer.json').posts;p.length?p[p.length-1].date:''")
          if [[ -n "$LASTP" && ! "$LASTP" < "$TARGET" ]]; then echo "already posted/scheduled for $LASTP"; exit 0; fi
          SKIP=""
          for ATTEMPT in 1 2 3 4 5; do
            PLAN=$(node tools/plan-next.js --page flightviewer --flightday "$FLIGHTDAY" --skip "$SKIP") || { echo "no candidate left"; exit 1; }
            STYLE=$(echo "$PLAN" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).style")
            ROUTE=$(echo "$PLAN" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).route")
            AIRL=$(echo "$PLAN" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).airline")
            echo "attempt $ATTEMPT: $STYLE $ROUTE $AIRL"
            ARGS=(-f ref=${{ github.ref_name }} -f "inputs[airline]=$AIRL" -f "inputs[route]=$ROUTE" -f "inputs[date]=$FLIGHTDAY" -f "inputs[logo_file]=$LOGO" -f "inputs[narration]=global" -f "inputs[overview]=auto" -f "inputs[flight_secs]=70")
            if [[ "$STYLE" == *music ]]; then ARGS+=(-f "inputs[style]=music"); else
              # rotate Google British English (en-GB) Chirp3 HD voices by number of Flight Viewer posts so far
              VOICES=(en-GB-Chirp3-HD-Aoede:FEMALE en-GB-Chirp3-HD-Charon:MALE en-GB-Chirp3-HD-Kore:FEMALE en-GB-Chirp3-HD-Puck:MALE en-GB-Chirp3-HD-Leda:FEMALE en-GB-Chirp3-HD-Fenrir:MALE en-GB-Chirp3-HD-Zephyr:FEMALE en-GB-Chirp3-HD-Orus:MALE)
              NPOSTS=$(node -p "require('./data/history-flightviewer.json').posts.length")
              VPICK=${VOICES[$(( (NPOSTS + ATTEMPT - 1) % ${#VOICES[@]} ))]}; VNAME=${VPICK%%:*}; VGEN=${VPICK##*:}
              echo "voice: $VNAME ($VGEN)"
              ARGS+=(-f "inputs[style]=voice" -f "inputs[voice_name]=$VNAME" -f "inputs[voice_gender]=$VGEN" -f "inputs[bg_file]=assets/flightviewer-bg.mp3")
            fi
            STARTED=$(date -u +%FT%TZ)
            gh api -X POST "repos/${{ github.repository }}/actions/workflows/render.yml/dispatches" "${ARGS[@]}"
            sleep 25
            RUN=$(gh run list --workflow render.yml --event workflow_dispatch --json databaseId,createdAt --jq "[.[]|select(.createdAt>=\"$STARTED\")]|last|.databaseId")
            echo "render run $RUN"
            if gh run watch "$RUN" --exit-status --interval 30 >/dev/null 2>&1; then break; fi
            echo "render failed for $ROUTE:$AIRL (likely no matching flight) - trying next candidate"
            SKIP="$SKIP,$ROUTE:$AIRL"; SKIP=${SKIP#,}
            [ "$ATTEMPT" = 5 ] && { echo "giving up today"; exit 1; }
          done
          # take the release made by THIS render run (release createdAt is the commit date, so several renders on one commit tie and the newest-by-date pick can grab another page's video)
          TAG=$(gh api "repos/${{ github.repository }}/releases?per_page=30" --jq "[.[]|select((.tag_name|startswith(\"video-\")) and ((.body // \"\")|contains(\"(render run $RUN)\")))]|first|.tag_name // empty")
          [ -n "$TAG" ] || { echo "no release found for render run $RUN"; exit 1; }
          echo "release $TAG"
          mkdir -p out && gh release download "$TAG" -p raw.json -p narration.json -D out
          VIDEO="https://github.com/${{ github.repository }}/releases/download/$TAG/video.mp4"
          node tools/make-caption-global.js out/raw.json out/caption.json
          FLIGHT=$(node -p "require('./out/raw.json').meta.flight")
          if [ "$DRY" = "true" ]; then node tools/buffer-post.js --page flightviewer --dry --video "$VIDEO" --caption out/caption.json --due "$DUE"; echo "dry run: $VIDEO"; exit 0; fi
          node tools/buffer-post.js --page flightviewer --video "$VIDEO" --caption out/caption.json --due "$DUE"
          FROMI=$(node -p "require('./out/raw.json').meta.fromIcao"); TOI=$(node -p "require('./out/raw.json').meta.toIcao")
          node tools/plan-next.js --page flightviewer --record --date "$TARGET" --style "$STYLE" --flight "$FLIGHT" --airline "$AIRL" --from "$FROMI" --to "$TOI" --note "auto-scheduled $DUE${VNAME:+ voice $VNAME}" --variants "$(node -p "JSON.stringify(require('./out/caption.json').variants)")"
          git config user.name "flightviewer-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/history-flightviewer.json && git commit -m "Flight Viewer $TARGET: $FLIGHT $FROMI-$TOI ($STYLE)" && git push
