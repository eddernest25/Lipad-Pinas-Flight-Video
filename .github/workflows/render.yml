name: Render flight video

on:
  workflow_dispatch:
    inputs:
      flight:
        description: "Real flight number, e.g. PR127 (leave empty to use raw_track sample instead)"
        default: ""
      date:
        description: "Flight date YYYY-MM-DD (the day it took off)"
        default: ""
      route:
        description: "Optional ICAO route to list alternatives if the flight number is not found, e.g. RPLL-WSSS"
        default: ""
      logo_pos:
        description: "Lipad Pinas logo position: tl tr bl br bc"
        default: "tr"
      raw_track:
        description: "Only used when flight is empty: raw track JSON in the repo (see data/)"
        default: "data/mnl-ceb-raw.json"
      flight_secs:
        description: "Total video length in seconds"
        default: "64"
      zoom_cruise:
        description: "Cruise zoom (6.4 = regional international, 8.2 = short domestic hop)"
        default: "6.4"
      fps:
        description: "Render fps (output is always 30)"
        default: "15"
  # Daily schedule - enable once a real flight-data step exists (see README):
  # schedule:
  #   - cron: "0 22 * * *"    # 22:00 UTC = 06:00 PHT

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install ffmpeg + dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-liberation
          npm install
          npx playwright install --with-deps chromium
      - name: Clean track + render video
        env:
          GOOGLE_MAP_TILES_KEY: ${{ secrets.GOOGLE_MAP_TILES_KEY }}
          FR24_API_KEY: ${{ secrets.FR24_API_KEY }}
        run: |
          mkdir -p out
          RAW="${{ inputs.raw_track }}"
          if [ -n "${{ inputs.flight }}" ]; then
            node tools/fetch-fr24.js --flight "${{ inputs.flight }}" --date "${{ inputs.date }}" --route "${{ inputs.route }}" --out out/raw.json
            RAW=out/raw.json
          fi
          node tools/process-track.js "$RAW" out/track.json --pacing uniform --dt 10 --video-secs "${{ inputs.flight_secs }}" --pad-secs 2
          AIRLOGO=""; [ -f out/airline.png ] && AIRLOGO="--airline-logo out/airline.png"
          node render-flat.js --track out/track.json --out out/video.mp4 \
            --fps "${{ inputs.fps }}" --out-fps 30 --intro 0 --flight "${{ inputs.flight_secs }}" --outro 0 \
            --zoom-close 12 --zoom-cruise "${{ inputs.zoom_cruise }}" --zoom-out-end .16 --zoom-in-start .88 \
            --logo assets/logo.png --logo-pos "${{ inputs.logo_pos }}" $AIRLOGO --max-tiles 8000
      - name: Publish video (public release link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="video-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" out/video.mp4 --title "$TAG" --notes "Rendered from ${{ inputs.flight || inputs.raw_track }} ${{ inputs.date }}"
          echo "Video: https://github.com/${{ github.repository }}/releases/download/$TAG/video.mp4" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/video.mp4
